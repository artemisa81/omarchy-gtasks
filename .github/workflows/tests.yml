name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Lint the setup script
        run: shellcheck -S warning setup.sh
      - name: Run the Tasks.js unit tests
        run: node --test tests/tasks.test.js
      - name: Validate the plugin manifest
        run: |
          if command -v omarchy-plugin-validate >/dev/null 2>&1; then
            omarchy-plugin-validate .
          else
            # The manifest schema checks also live in the validator; on a runner
            # without Omarchy, at least prove it is parseable JSON.
            jq -e '.schemaVersion == 1 and .id and .kinds and .entryPoints' manifest.json >/dev/null
            echo "manifest is structurally valid JSON"
          fi
